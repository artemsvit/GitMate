name: Release macOS DMG & Notarize
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.1.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gitler-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release-macos:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GITLER_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json > "$RUNNER_TEMP/notary-history.json"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Set up ephemeral signing keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/gitler-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application'
      - run: npm run build:dmg-assets
      - name: Sign and notarize Apple Silicon app
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - run: npm run verify:package
      - name: Notarize DMG and finalize hashes
        run: node scripts/finalize-release.cjs
      - name: Validate both distribution formats
        run: node scripts/validate-release.cjs
      - name: Save notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ env.RELEASE_TAG }}
          path: release/notarization/*.json
          if-no-files-found: ignore
      - name: Upload verified draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false
      - name: Clean signing keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if test -f "$RUNNER_TEMP/original-keychains.txt"; then
            python3 -c 'import shlex,subprocess,sys; subprocess.run(["security","list-keychains","-d","user","-s",*shlex.split(open(sys.argv[1]).read())],check=True)' "$RUNNER_TEMP/original-keychains.txt"
          fi
          security delete-keychain "$RUNNER_TEMP/gitler-build.keychain-db" || true
