appId: com.artemsvit.gitler
productName: Gitler
copyright: Copyright © 2026 Artem Svitelskyi

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - landing/**/*
  - package.json
  - node_modules/**/*

afterPack: scripts/unique-app-uuid.cjs
afterSign: scripts/notarize-app.cjs

asarUnpack:
  - "server/**/*"
  - "node_modules/@node-llama-cpp/**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  minimumSystemVersion: "12.0.0"
  extendInfo:
    NSDesktopFolderUsageDescription: "Gitler needs permission to access your Desktop to discover and manage local Git repositories."
    NSDocumentsFolderUsageDescription: "Gitler needs permission to access your Documents to discover and manage local Git repositories."
    NSDownloadsFolderUsageDescription: "Gitler needs permission to access your Downloads to discover and manage local Git repositories."
    NSLocalNetworkUsageDescription: "Gitler needs permission to access your local network to connect to self-hosted Git servers such as Gitea, Forgejo, and GitLab."
  # Resource data is sealed by its containing bundle; it does not need a separate code signature.
  signIgnore:
    - '\.pak$'
    - '/MainMenu\.nib($|/)'
  # Release afterSign submits, records acceptance, and staples before archiving.
  notarize: false

dmg:
  title: "Install ${productName}"
  background: build/background.tiff
  iconSize: 80
  contents:
    - x: 130
      y: 195
      type: file
    - x: 410
      y: 195
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: artemsvit
  repo: Gitler
  releaseType: release
